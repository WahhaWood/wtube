name: Release

# A tag v<version> builds the signed APK and publishes it with the tag's message as the notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Tag matches the version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          [ "$TAG" = "v$NAME" ] || { echo "Tag $TAG does not match versionName $NAME"; exit 1; }
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1)
          PREV_CODE=$(git show "$PREV:app/build.gradle.kts" | sed -n 's/.*versionCode = \([0-9]*\).*/\1/p')
          [ "$CODE" -gt "$PREV_CODE" ] || { echo "versionCode $CODE is not above $PREV_CODE ($PREV)"; exit 1; }
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WTUBE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WTUBE_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wtube-release.jks"
          mkdir -p ~/.gradle
          {
            echo "wtube.keystore=$RUNNER_TEMP/wtube-release.jks"
            echo "wtube.keystore.password=$KEYSTORE_PASSWORD"
          } >> ~/.gradle/gradle.properties
      - name: Unit tests (offline) and release build
        run: ./gradlew testDebugUnitTest assembleRelease -Poffline
      - name: Check the signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          # Every release so far is signed with this key; another one would not install over them.
          "$APKSIGNER" verify --print-certs "$APK" | grep -q 'SHA-256 digest: 7176fdd0e04f6dabef40d308596f3152e76d09f86ef2ae0d742a9600b1ee7948'
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: app/build/outputs/apk/release/app-release.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "WTube-$VERSION.apk"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          [ -s notes.md ] || git log -1 --format=%B > notes.md
          printf '\nSHA-256: `%s`\n' "$(sha256sum "WTube-$VERSION.apk" | cut -d' ' -f1)" >> notes.md
          gh release create "$TAG" "WTube-$VERSION.apk" --title "WTube $VERSION" --notes-file notes.md --verify-tag
      - name: Wipe the key
        if: always()
        run: rm -f "$RUNNER_TEMP/wtube-release.jks" ~/.gradle/gradle.properties
